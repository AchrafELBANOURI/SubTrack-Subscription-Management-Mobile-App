spring:
    config:
        import:
            - optional:file:.env[.properties]
            - optional:file:backend/.env[.properties]
    application:
        name: subtrack-backend
    datasource:
        url: ${DATABASE_URL}
        username: ${DATABASE_USERNAME}
        password: ${DATABASE_PASSWORD}
    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: update
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: ${CLERK_ISSUER}
                    jwk-set-uri: ${CLERK_JWKS_URL}

server:
    port: ${PORT:8080}
